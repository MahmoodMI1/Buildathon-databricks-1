[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
rayon = "1"
memmap2 = "0.9"
memchr = "2"
hashbrown = "0.15"
parquet = { version = "55", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = false
