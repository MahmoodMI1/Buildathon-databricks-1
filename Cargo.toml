[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
rayon = "1"
memmap2 = "0.9"
memchr = "2"
hashbrown = "0.15"
libc = "0.2"
mimalloc = { version = "0.1", default-features = false, optional = true }

[features]
default = ["mi"]
mi = ["dep:mimalloc"]
# Profiling only: counts allocations. Never enabled in the image.
prof = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = false
